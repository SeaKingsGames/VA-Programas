<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ECEFF3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10161E" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Programas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Programas Valle de Aragón señas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEFF3; --surface:#FFFFFF; --surface-2:#F3F5F8; --ink:#17202C; --muted:#566172; --line:#D5DCE4;
  --accent:#2C52B0; --accent-ink:#FFFFFF; --accent-soft:#E1E8F8;
  --ok:#1F7A55; --warn:#9A5800; --danger:#B3261E;
  --font:"Atkinson Hyperlegible","Segoe UI",Roboto,system-ui,-apple-system,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10161E; --surface:#19222D; --surface-2:#222C38; --ink:#E9EDF2; --muted:#A0AAB8; --line:#2E3948;
    --accent:#8AA8FF; --accent-ink:#0E1626; --accent-soft:#1F2D4D; --ok:#46B784; --warn:#F0B35A; --danger:#FF8A80;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10161E; --surface:#19222D; --surface-2:#222C38; --ink:#E9EDF2; --muted:#A0AAB8; --line:#2E3948;
  --accent:#8AA8FF; --accent-ink:#0E1626; --accent-soft:#1F2D4D; --ok:#46B784; --warn:#F0B35A; --danger:#FF8A80;
  color-scheme:dark;
}
html{font-size:17px;scroll-padding-top:env(safe-area-inset-top,0px)}
html.letra-grande{font-size:20px}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body.con-sheet{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%;display:block}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

#app{max-width:860px;margin:0 auto;min-height:100%}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.marca{display:flex;flex-direction:column;min-width:0}
.marca b{font-size:1.05rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.marca span{font-size:.8rem;color:var(--muted)}
.top-acc{display:flex;gap:8px;align-items:center;flex-shrink:0}
.estado{font-size:.8rem;color:var(--muted)}
.main{padding:12px 16px calc(100px + env(safe-area-inset-bottom,0px))}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;gap:4px;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.nav a{flex:1;max-width:150px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:14px;color:var(--muted);text-decoration:none;font-size:.78rem;font-weight:700}
.nav a svg.i{width:26px;height:26px}
.nav a.on{color:var(--accent);background:var(--accent-soft)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;padding:.55em 1em;border-radius:12px;min-height:44px;cursor:pointer;text-decoration:none;line-height:1.2;text-align:center}
.btn.primario{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.peligro{color:var(--danger)}
.btn.peligro-lleno{background:var(--danger);color:#fff;border-color:transparent}
.btn.chico{min-height:38px;padding:.35em .75em;font-size:.9rem}
.btn.icono-solo{width:44px;padding:0}
.btn.ancho{width:100%;margin-top:12px}
.btn.enlace{border:0;background:none;color:var(--accent);text-decoration:underline;min-height:36px}
.btn[disabled]{opacity:.6}

/* ---------- Lector: tira de fechas y hoja del día ---------- */
.tira-fechas{position:relative;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:4px 16px 10px;scroll-snap-type:x proximity}
.tira-fechas::-webkit-scrollbar{display:none}
.chip-fecha{flex:0 0 auto;width:60px;display:flex;flex-direction:column;align-items:center;padding:8px 0 7px;border-radius:16px;border:1px solid var(--line);background:var(--surface);cursor:pointer;scroll-snap-align:center;line-height:1.1}
.chip-fecha span,.chip-fecha small{font-size:.72rem;color:var(--muted)}
.chip-fecha b{font-size:1.45rem}
.chip-fecha.pasada{opacity:.5}
.chip-fecha.on{background:var(--ink);color:var(--bg);border-color:var(--ink);opacity:1}
.chip-fecha.on span,.chip-fecha.on small{color:inherit;opacity:.8}

.hoja-fecha{display:flex;align-items:center;gap:14px;margin:12px 0 4px}
.hf-num{font-size:4.6rem;font-weight:700;line-height:.82;letter-spacing:-.04em;color:var(--accent);font-variant-numeric:tabular-nums}
.hf-txt{display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.hf-txt b{font-size:1.55rem;line-height:1.05}
.hf-txt .hf-mes{font-size:1rem;font-weight:400;color:var(--muted)}

.instalar{display:grid;grid-template-columns:52px 1fr;gap:4px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;margin:4px 0 8px}
.instalar img{width:52px;height:52px;border-radius:14px;grid-row:span 2}
.instalar b{line-height:1.25}
.instalar p{margin:0;font-size:.88rem;color:var(--muted)}
.instalar p svg.i{width:18px;height:18px;vertical-align:-3px;color:var(--accent)}
.instalar .acciones{grid-column:1/-1;margin-top:8px}

/* ---------- Bloques de programa ---------- */
.bloque{--c:var(--accent);background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:20px;padding:14px 14px 16px;margin:14px 0}
.bloque-tit{display:flex;align-items:center;gap:10px;font-size:1.1rem;line-height:1.2;margin:0 0 12px}
.tit-ico,.item-ico,.parte-ico,.asig-ico{display:grid;place-items:center;flex-shrink:0;border-radius:12px;background:var(--surface-2)}
.tit-ico{width:40px;height:40px;font-size:1.35rem;background:color-mix(in srgb,var(--c) 15%,var(--surface))}
.tit-ico img,.item-ico img,.parte-ico img,.asig-ico img{width:26px;height:26px;object-fit:contain}
.bloque-sub{font-size:.88rem;color:var(--muted);margin:-8px 0 12px 50px}
.roles{display:flex;flex-wrap:wrap;gap:16px 20px}
.rol{display:flex;flex-direction:column;gap:6px;min-width:0}
.rol-cab{display:flex;align-items:center;gap:6px;font-size:.88rem;font-weight:700;color:var(--muted)}
.rol-cab .ico{font-size:1.1rem}
.rol-cab .ico-img{width:20px;height:20px;object-fit:contain}
.rol-texto{margin:0;font-weight:700}
.caras{display:flex;flex-wrap:wrap;gap:10px}

.cara{--w:88px;width:var(--w);margin:0;text-align:center}
.cara[data-act]{cursor:pointer}
.cara .foto{position:relative;width:100%;aspect-ratio:4/5;border-radius:16px;overflow:hidden;background:var(--surface-2)}
.cara .foto img{width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.cara figcaption{margin-top:5px;line-height:1.2}
.cara figcaption .n{font-size:.84rem;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.cara figcaption small{display:block;color:var(--muted);font-size:.74rem}
.cara.p{--w:64px}
.cara.p .foto{border-radius:12px}
.cara.p figcaption .n{font-size:.74rem}
.cara.g{--w:84px}
.cara.xl{--w:170px;margin:0 auto}
.cara.xl .foto{border-radius:24px}
.cara.xl figcaption .n{font-size:1.3rem}
.iniciales{width:100%;height:100%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:1.5em;background:hsl(var(--h) 40% 42%)}
.cara.p .iniciales{font-size:1.05em}
.cara.xl .iniciales{font-size:3em}
.badge{position:absolute;right:5px;bottom:5px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface);font-size:1rem;box-shadow:0 0 0 2px var(--c,var(--accent))}
.badge img{width:20px;height:20px;object-fit:contain}
.turno{position:absolute;left:4px;top:4px;padding:1px 7px;border-radius:999px;background:var(--c,var(--accent));color:#fff;font-size:.72rem;font-weight:700}

.mini-caras{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.carita{width:34px;height:34px;border-radius:50%;overflow:hidden;flex-shrink:0;background:var(--surface-2);display:block}
.carita img{width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.carita .iniciales{font-size:.78rem}
.rol-opcion .opcion-valor{font-size:1.75rem;font-weight:700;color:var(--c);line-height:1.1}

.rol-para{flex-direction:row;align-items:flex-start;gap:12px;flex-basis:100%;padding:10px;border-radius:16px;background:var(--surface-2)}
.rol-para .destino .cara{--w:80px}
.rol-para .destino .foto{outline:3px solid var(--c);outline-offset:2px}
.rol-para .interpretes{display:flex;flex-direction:column;gap:6px;min-width:0}
.rol-para .interpretes .caras{gap:8px}
.rol-para .interpretes .cara{--w:60px}
.etq-mini{display:flex;align-items:center;gap:6px;font-size:.82rem;font-weight:700;color:var(--muted)}

/* ---------- Reunión por partes ---------- */
.partes{margin:0 -14px -16px}
.seccion{display:flex;align-items:center;gap:8px;margin:6px 0 0;padding:8px 14px;background:var(--s);color:#fff;font-size:.95rem;line-height:1.2}
.parte{display:grid;grid-template-columns:42px 1fr;gap:6px 12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.parte:last-child{border-bottom:0}
.parte-ico{width:42px;height:42px;font-size:1.3rem;background:color-mix(in srgb,var(--s) 16%,var(--surface))}
.parte-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.parte-txt b{font-size:1rem;line-height:1.25}
.minutos{display:inline-flex;align-items:center;gap:4px;font-size:.85rem;color:var(--muted)}
.minutos svg.i{width:16px;height:16px}
.parte .caras{grid-column:2}
.nota{background:var(--surface-2);padding:10px 12px;border-radius:12px;margin:0 0 12px}

/* ---------- Lector: programas y personas ---------- */
.tira-formatos{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 6px;padding:4px 16px 8px}
.tira-formatos::-webkit-scrollbar{display:none}
.chip-formato{--c:var(--accent);flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;white-space:nowrap;min-height:44px}
.chip-formato.on{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c);background:color-mix(in srgb,var(--c) 12%,var(--surface))}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.88rem;cursor:pointer;min-height:38px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tit-prog{font-size:1.6rem;margin:12px 0 0;line-height:1.15}
.sub-prog{color:var(--muted);margin:2px 0 8px}
.dia{display:grid;grid-template-columns:50px 1fr;gap:8px;align-items:start;margin:12px 0}
.dia.pasada{opacity:.55}
.dia-cab{margin:6px 0 0;display:flex;flex-direction:column;align-items:center;line-height:1}
.dia-cab b{font-size:1.9rem}
.dia-cab span{font-size:.75rem;color:var(--muted);font-weight:700;margin-top:3px}
.dia .bloque{margin:0}
.dia .cara{--w:76px}

.buscar{margin:4px 0 14px}
.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:16px 10px}
.celda{background:none;border:0;padding:0;cursor:pointer;text-align:center;color:inherit;display:flex;flex-direction:column;align-items:center}
.celda .cara{--w:100%}
.celda.actual .foto{outline:3px solid var(--accent);outline-offset:2px}
.celda.nueva{border:2px dashed var(--line);border-radius:16px;min-height:120px;justify-content:center;padding:8px;font-weight:700;color:var(--accent)}
.ocupado{display:block;font-size:.7rem;color:var(--warn);line-height:1.2;margin-top:2px}
.sin-foto{display:block;font-size:.72rem;color:var(--warn);margin-top:2px}

.ficha{display:flex;flex-direction:column;align-items:center;gap:8px;margin:4px 0 14px}
.asig{list-style:none;margin:0;padding:0}
.asig-item{--c:var(--accent);display:grid;grid-template-columns:46px 40px 1fr;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.asig-fecha{display:flex;flex-direction:column;align-items:center;line-height:1.05}
.asig-fecha b{font-size:1.5rem}
.asig-fecha span{font-size:.7rem;color:var(--muted)}
.asig-ico{width:40px;height:40px;font-size:1.25rem;background:color-mix(in srgb,var(--c) 15%,var(--surface))}
.asig-txt b{display:block;line-height:1.25}
.asig-txt span{font-size:.85rem;color:var(--muted)}
details.pasadas summary{cursor:pointer;font-weight:700;padding:12px 0;color:var(--muted)}

/* ---------- Hojas (sheets) ---------- */
.capa{position:fixed;inset:0;z-index:60;background:rgb(10 15 25 / .5);display:flex;align-items:flex-end;justify-content:center}
.sheet{position:relative;width:100%;max-width:640px;max-height:90vh;max-height:90dvh;overflow:auto;overscroll-behavior:contain;background:var(--surface);border-radius:24px 24px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet.entra{animation:sube .22s ease-out}
@keyframes sube{from{transform:translateY(28px);opacity:.5}to{transform:none;opacity:1}}
.asa{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet-tit{font-size:1.2rem;margin:4px 0 12px;line-height:1.25}
@media (min-width:700px){.capa{align-items:center}.sheet{border-radius:24px}}

/* ---------- Editor ---------- */
.aviso{background:var(--accent-soft);color:var(--ink);padding:10px 12px;border-radius:14px;font-size:.9rem;margin:6px 0 12px}
.ed-cab{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 10px}
.ed-cab h1,.ed h1{margin:6px 0;font-size:1.6rem;line-height:1.15}
.grupo-tit{font-size:.95rem;color:var(--muted);margin:20px 0 6px}
.item{--c:var(--accent);display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);margin:8px 0;flex:1;min-width:0}
.item-ico{width:40px;height:40px;font-size:1.3rem;background:color-mix(in srgb,var(--c) 15%,var(--surface))}
.item-txt{display:flex;flex-direction:column;min-width:0;flex:1}
.item-txt span{font-size:.85rem;color:var(--muted)}
.item-wrap{display:flex;align-items:center;gap:6px}
.orden{display:flex;flex-direction:column;gap:4px}
.pill{display:inline-block;font-size:.75rem;font-weight:700;padding:.2em .7em;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.borrador{background:color-mix(in srgb,var(--warn) 18%,var(--surface));color:var(--warn)}
.volver{display:inline-flex;align-items:center;gap:4px;font-weight:700;text-decoration:none;margin:4px 0 8px;min-height:40px}
.ed-prog-cab{--c:var(--accent);display:flex;align-items:center;gap:12px;margin-bottom:8px}
.ed-prog-cab > div{flex:1;min-width:0}
.input-titulo{width:100%;font-size:1.35rem;font-weight:700;border:0;border-bottom:2px dashed var(--line);border-radius:0;padding:4px 0;background:transparent;min-height:44px}
.ed-prog-cab .sub{display:block;font-size:.88rem;color:var(--muted)}
.barra{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:8px 0 14px;flex-wrap:wrap}
.interruptor{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px 6px 6px;font-weight:700;cursor:pointer;min-height:44px;text-align:left;font-size:.9rem}
.perilla{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex-shrink:0;transition:background .15s}
.perilla::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.interruptor.on .perilla{background:var(--ok)}
.interruptor.on .perilla::after{transform:translateX(18px)}

.ed-fila{--c:var(--accent);background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:16px;padding:12px;margin:12px 0}
.ed-fila-cab{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.ed-fila-cab input{width:auto;flex:0 1 180px}
.dia-nombre{flex:1;font-weight:700}
.ed-roles{display:flex;flex-wrap:wrap;gap:14px 18px}
.ed-rol{display:flex;flex-direction:column;gap:6px}
.ed-rol.ancho{flex-basis:100%}
.slots{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
.slot{background:none;border:0;padding:0;cursor:pointer;width:64px;text-align:center;color:inherit}
.slot-vacio{position:relative;display:grid;place-items:center;aspect-ratio:4/5;width:64px;border:2px dashed var(--line);border-radius:12px;font-size:1.6rem;color:var(--muted)}
.slot-vacio small{position:absolute;top:3px;left:5px;font-size:.7rem;font-weight:700}
.slot-nom{display:block;font-size:.74rem;color:var(--muted);margin-top:5px}
.segmentado{display:flex;flex-wrap:wrap;gap:6px}
.segmentado button{padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;min-height:44px}
.segmentado button.on{background:var(--c);border-color:var(--c);color:#fff}

.ed-parte{--s:var(--accent);background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--s);border-radius:16px;padding:12px;margin:12px 0;display:flex;flex-direction:column;gap:8px}
.fila-campos{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fila-campos > input,.fila-campos > select{flex:1 1 140px;min-width:0}
.fila-campos > input.min{flex:0 0 84px}
.btn-ico{width:44px;height:44px;flex-shrink:0;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-size:1.3rem;display:grid;place-items:center;cursor:pointer;padding:0}
.btn-ico.grande{width:56px;height:56px;font-size:1.7rem}
.btn-ico img{width:28px;height:28px;object-fit:contain}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;align-self:center}
.stepper button{width:42px;height:42px;border:0;background:var(--surface-2);font-size:1.2rem;cursor:pointer}
.stepper span{min-width:34px;text-align:center;font-weight:700}
.mover{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:700}
.check input{width:22px;height:22px;min-height:0;margin:0}
.dias{display:flex;gap:6px;flex-wrap:wrap}
.dias button{min-width:52px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer}
.dias button.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.swatches{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 10px}
.swatches button{width:36px;height:36px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);background:var(--sw);cursor:pointer;padding:0}
.swatches button.on{box-shadow:0 0 0 3px var(--ink)}
.swatches.chicos button{width:28px;height:28px}
.emojis{display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:6px;margin-bottom:12px}
.emojis button{height:50px;font-size:1.5rem;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer}
.emojis button.on{outline:3px solid var(--accent)}
.foto-edit{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;margin-bottom:4px}
.foto-grande{position:relative;width:150px;aspect-ratio:4/5;border-radius:22px;overflow:hidden;background:var(--surface-2);display:block}
.foto-grande img{width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.foto-grande .iniciales{font-size:2.6rem}
.subiendo{position:absolute;inset:0;display:grid;place-items:center;background:rgb(0 0 0 / .55);color:#fff;font-weight:700}
.centro{text-align:center}
.acciones{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.botones{display:flex;flex-direction:column;gap:8px}
.ayuda{font-size:.9rem;color:var(--muted);margin:4px 0 10px}
.etq{display:block;font-size:.85rem;color:var(--muted);font-weight:700;margin:14px 0 6px}
.lista-opc{display:flex;flex-direction:column;gap:6px}
.opc{--c:var(--accent);display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;text-align:left;min-height:50px}
.opc.on{border-color:var(--c);box-shadow:inset 0 0 0 2px var(--c)}
.opc small{display:block;font-weight:400;color:var(--muted)}
.campo{display:block;margin:10px 0}
.campo > span{display:block;font-size:.85rem;color:var(--muted);font-weight:700;margin-bottom:4px}
input,select,textarea{width:100%;padding:.55em .7em;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-height:44px}
textarea{min-height:200px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.78rem}
.vacio{text-align:center;padding:40px 16px;color:var(--muted)}
.vacio b{color:var(--ink);font-size:1.1rem}
.vacio-mini{color:var(--muted);font-size:.92rem;grid-column:1/-1}
.cargando{padding:70px 0;text-align:center;color:var(--muted)}
.login{max-width:420px;margin:12px auto}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:90;max-width:calc(100% - 32px);text-align:center}
.toast.ver{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.sheet.entra{animation:none}.toast,.perilla,.perilla::after{transition:none}}

function blobADataURL(b) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); }); }
async function comprimir(file, max, tipo = 'image/jpeg') {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Imagen no válida')); i.src = url; });
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.max(1, Math.round(img.naturalWidth * k)), h = Math.max(1, Math.round(img.naturalHeight * k));
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    if (tipo === 'image/jpeg') { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); }
    ctx.drawImage(img, 0, 0, w, h);
    return await new Promise(res => c.toBlob(res, tipo, 0.82));
  } finally { URL.revokeObjectURL(url); }

const DEMO_KEY = 'agenda-senas-demo-v1';
const Store = {
  nube: false, sb: null, user: null, editor: false,
  async iniciar() {

    try {
      await cargarScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js');
      this.sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

      this.user = data && data.session ? data.session.user : null;

    } catch (e) {
      console.error(e); this.nube = false;
      toast('No se pudo conectar con la base de datos. Se abrió el modo demo.');
    }
  },
  async revisarEditor() { const { data, error } = await this.sb.rpc('es_editor'); this.editor = !error && data === true; },
  async cargar() {
    if (!this.nube) {
      let d = null;

    catch (e) { toast('No hay espacio en este dispositivo. Usa fotos más pequeñas o conecta Supabase.'); return false; }
  },

  async guardar(col, obj) {

    case 'seccion': { const f = form(); const x = f && (f.secciones || []).find(y => y.id === d.sec); return x && { obj: x, root: f, colec: 'formatos' }; }

    const tipo = el.dataset.tipo; const sec = { id: uid(), nombre: 'Sección', color: '#2C52B0', icono: '📖' };
    const f = { id: 'f-' + uid(), nombre: tipo === 'reunion' ? 'Nueva reunión' : 'Nuevo formato', icono: tipo === 'reunion' ? '📖' : '📋', color: '#2C52B0', tipo,
      orden: Math.max(0, ...S.formatos.map(x => x.orden || 0)) + 1, dias: [5, 6], etiquetaTurno: '',
      roles: tipo === 'reunion' ? [] : [{ id: uid(), nombre: 'Asignación', icono: '⭐', modo: 'personas', cantidad: 1, opciones: [], paraPersona: '', turnos: false }],
      secciones: tipo === 'reunion' ? [sec] : [],
      partes: tipo === 'reunion' ? [{ id: uid(), seccionId: sec.id, icono: '🎵', titulo: 'Canción y oración', tema: '', minutos: 5, cantidad: 1, etiquetas: '' }] : [] };
    S.formatos.push(f); guardarLuego('formatos', f); cerrarSheet(); location.hash = '#/editor/formato/' + f.id;
  },
  'formato-subir'(el) { moverFormato(el.dataset.id, -1); },
  'formato-bajar'(el) { moverFormato(el.dataset.id, 1); },
  async 'icono-formato'() { const f = formato(UI.editId); if (!f) return; const ic = await elegirIcono(f.icono); if (ic === undefined) return; f.icono = ic; guardarLuego('formatos', f); render(); },
  'color-formato'(el) { const f = formato(UI.editId); if (!f) return; f.color = el.dataset.v; guardarLuego('formatos', f); render(); },
  dia(el) { const f = formato(UI.editId); if (!f) return; const d = Number(el.dataset.d); f.dias = f.dias || []; f.dias = f.dias.includes(d) ? f.dias.filter(x => x !== d) : [...f.dias, d]; guardarLuego('formatos', f); render(); },
  'rol-agregar'() { const f = formato(UI.editId); if (!f) return; f.roles = f.roles || []; f.roles.push({ id: uid(), nombre: '', icono: '⭐', modo: 'personas', cantidad: 1, opciones: [], paraPersona: '', turnos: false }); guardarLuego('formatos', f); render(); },
  'rol-subir'(el) { const x = rolDe(el); if (!x) return; mover(x.f.roles, x.f.roles.indexOf(x.r), -1); guardarLuego('formatos', x.f); render(); },
  'rol-bajar'(el) { const x = rolDe(el); if (!x) return; mover(x.f.roles, x.f.roles.indexOf(x.r), 1); guardarLuego('formatos', x.f); render(); },
  async 'rol-quitar'(el) { const x = rolDe(el); if (!x) return; if (!(await confirmar('¿Quitar esta asignación del formato? Lo ya asignado dejará de mostrarse.', 'Quitar'))) return; x.f.roles = x.f.roles.filter(r => r !== x.r); guardarLuego('formatos', x.f); render(); },
  'rol-mas'(el) { const x = rolDe(el); if (!x) return; x.r.cantidad = Math.min(12, (Number(x.r.cantidad) || 1) + 1); guardarLuego('formatos', x.f); render(); },
  'rol-menos'(el) { const x = rolDe(el); if (!x) return; x.r.cantidad = Math.max(1, (Number(x.r.cantidad) || 1) - 1); guardarLuego('formatos', x.f); render(); },
  async 'rol-para'(el) {
    const x = rolDe(el); if (!x) return;
    const r = await elegirPersona({ titulo: '¿Para quién es esta asignación?', actual: x.r.paraPersona || null });
    if (r === undefined) return;
    x.r.paraPersona = r || '';
    if (r && (!x.r.nombre || x.r.nombre === 'Asignación')) x.r.nombre = persona(r).nombre;
    guardarLuego('formatos', x.f); render();
  },
  'rol-usar-grupos'(el) { const x = rolDe(el); if (!x) return; x.r.opciones = [...S.ajustes.grupos]; guardarLuego('formatos', x.f); render(); },
  async 'icono-rol'(el) { const x = rolDe(el); if (!x) return; const ic = await elegirIcono(x.r.icono); if (ic === undefined) return; x.r.icono = ic; guardarLuego('formatos', x.f); render(); },
  'seccion-agregar'() { const f = formato(UI.editId); if (!f) return; f.secciones = f.secciones || []; f.secciones.push({ id: uid(), nombre: '', color: COLORES[f.secciones.length % COLORES.length], icono: '📖' }); guardarLuego('formatos', f); render(); },
  async 'seccion-quitar'(el) {
    const f = formato(UI.editId); if (!f) return;
    if (!(await confirmar('¿Quitar esta sección? Sus partes quedarán sin sección.', 'Quitar'))) return;
    const id = el.dataset.sec; f.secciones = (f.secciones || []).filter(s => s.id !== id);
    (f.partes || []).forEach(p => { if (p.seccionId === id) p.seccionId = ''; });
    guardarLuego('formatos', f); render();
  },
  'color-seccion'(el) { const f = formato(UI.editId); const s = f && (f.secciones || []).find(x => x.id === el.dataset.sec); if (!s) return; s.color = el.dataset.v; guardarLuego('formatos', f); render(); },
  async 'icono-seccion'(el) { const f = formato(UI.editId); const s = f && (f.secciones || []).find(x => x.id === el.dataset.sec); if (!s) return; const ic = await elegirIcono(s.icono); if (ic === undefined) return; s.icono = ic; guardarLuego('formatos', f); render(); },
  async 'borrar-formato'() {
    const f = formato(UI.editId); if (!f) return;
    const progs = S.programas.filter(p => p.formatoId === f.id);
    if (!(await confirmar(progs.length ? `¿Eliminar "${f.nombre}" y sus ${progs.length} programas? No se puede deshacer.` : `¿Eliminar "${f.nombre}"?`))) return;
    S.formatos = S.formatos.filter(x => x.id !== f.id); S.programas = S.programas.filter(p => p.formatoId !== f.id);
    pendientes.delete(f.id); progs.forEach(p => pendientes.delete(p.id));
    await borrarRegistro(f.id); for (const p of progs) await borrarRegistro(p.id);
    location.hash = '#/editor/formatos';
  },

  'ic-elegir'(el) { resolverIcono(el.dataset.v); },
  'ic-usar-texto'() { const v = ($('#ic-texto') || {}).value; if (v && v.trim()) resolverIcono(v.trim()); else toast('Escribe o pega un emoji.'); },
  'cf-si'() { if (!UI.cf) return; const r = UI.cf; UI.cf = null; cerrarSheet(); r(true); },

  exportar() {
    const json = JSON.stringify({ app: 'agenda-senas', version: 1, exportado: new Date().toISOString(), personas: S.personas, formatos: S.formatos, programas: S.programas, ajustes: S.ajustes });
    abrirSheet(() => `<h2 class="sheet-tit">Respaldo</h2><p class="ayuda">Guarda este texto en un lugar seguro. Con él puedes recuperar todo o pasarlo a la versión conectada.</p>
      <textarea id="exp" readonly aria-label="Respaldo">${esc(json)}</textarea>
      <div class="acciones"><button class="btn" data-act="copiar-export">Copiar</button><button class="btn" data-act="descargar-export">Descargar archivo</button><button class="btn primario" data-act="cerrar">Listo</button></div>`);
  },
  async 'copiar-export'() {
    const t = $('#exp'); if (!t) return;
    try { await navigator.clipboard.writeText(t.value); toast('Copiado'); }
    catch (e) { t.focus(); t.select(); try { document.execCommand('copy'); toast('Copiado'); } catch (e2) { toast('Selecciona el texto y cópialo manualmente.'); } }
  },
  'descargar-export'() {
    const t = $('#exp'); if (!t) return;
    try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([t.value], { type: 'application/json' })); a.download = `respaldo-programas-${hoyISO()}.json`; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }
    catch (e) { toast('No se pudo descargar aquí. Usa Copiar.'); }
  },
  importar() {
    abrirSheet(() => `<h2 class="sheet-tit">Importar respaldo</h2><p class="ayuda">Pega el texto del respaldo o elige el archivo. Esto reemplaza todos los datos actuales.</p>
      <label class="btn ancho" style="margin:0 0 10px">Elegir archivo<input type="file" accept=".json,application/json,text/plain" data-change="imp-archivo" hidden></label>
      <textarea id="imp" placeholder="Pega aquí el respaldo" aria-label="Respaldo a importar"></textarea>
      <div class="acciones"><button class="btn" data-act="cerrar">Cancelar</button><button class="btn primario" data-act="importar-ok">Importar</button></div>`);
  },
  async 'importar-ok'() {
    const txt = ($('#imp') || {}).value || '';
    let d; try { d = JSON.parse(txt); } catch (e) { return toast('El texto no es un respaldo válido.'); }
    if (!d || !Array.isArray(d.personas) || !Array.isArray(d.formatos) || !Array.isArray(d.programas)) return toast('Al respaldo le faltan datos.');
    if (!(await confirmar('Esto reemplaza todos los datos actuales. ¿Continuar?', 'Reemplazar'))) return;
    await reemplazar(normalizar(d)); toast('Respaldo importado');
  },
  async 'cargar-ejemplo'() {
    if (!(await confirmar('Esto reemplaza todos los datos actuales con el ejemplo de octubre 2026. ¿Continuar?', 'Reemplazar'))) return;
    await reemplazar(normalizar(datosEjemplo())); toast('Ejemplo cargado');
  },
  async salir() { await Store.salir(); location.hash = '#/'; await recargar(); }
};
async function reemplazar(d) {
  try { pendientes.clear(); clearTimeout(tGuardar); await Store.reemplazarTodo(d); asignar(d); UI.fecha = null; UI.formatoLector = null; UI.programaLector = null; render(); }
  catch (e) { console.error(e); toast('No se pudieron reemplazar los datos.'); }
}
function moverFormato(id, d) {
  const fs = ordenados(S.formatos); const i = fs.findIndex(f => f.id === id); const j = i + d;
  if (i < 0 || j < 0 || j >= fs.length) return;
  [fs[i], fs[j]] = [fs[j], fs[i]];
  fs.forEach((f, k) => { if (f.orden !== k + 1) { f.orden = k + 1; guardarLuego('formatos', f); } });
  render();
}

const ENTRADAS = {
  'buscar-lector'(el) { UI.buscar = el.value; const g = $('#rejilla'); if (g) g.innerHTML = rejillaPersonas(UI.buscar, 'ver-persona'); },
  'buscar-ed'(el) { UI.buscar = el.value; const g = $('#rejilla'); if (g) g.innerHTML = rejillaPersonas(UI.buscar, 'persona-editar', extraEd); },
  'buscar-picker'(el) { if (!UI.pk) return; UI.pk.q = el.value; const g = $('#rejilla-pk'); if (g) g.innerHTML = rejillaPicker(); }
};
const CAMBIOS = {
  'foto-persona'(el) { subirFotoPersona(el); },
  async 'ic-subir'(el) {
    const file = el.files && el.files[0]; if (!file) return;
    try { const blob = await comprimir(file, 160, 'image/png'); const url = await Store.subirFoto(blob); resolverIcono(url); }
    catch (e) { console.error(e); toast('No se pudo subir la imagen.'); }
  },
  'imp-archivo'(el) { const file = el.files && el.files[0]; if (!file) return; const r = new FileReader(); r.onload = () => { const t = $('#imp'); if (t) t.value = r.result; }; r.readAsText(file); }
};

/* ===================== Render y rutas ===================== */
function ruta() {
  const [a, b, c] = location.hash.replace(/^#\/?/, '').split('/');
  if (a === 'editor') return { editor: true, vista: b || 'programas', id: c ? decodeURIComponent(c) : '' };
  return { editor: false, vista: a || 'reuniones' };
}
function cabecera(r) {
  const a = S.ajustes;
  const der = r.editor
    ? `<span id="estado-guardado" class="estado" aria-live="polite">${esc(UI.guardado)}</span><a class="btn chico" href="#/">${ICON.ojo}Ver</a>`
    : `<button class="btn chico" data-act="letra" aria-label="${UI.letra === 'grande' ? 'Letra normal' : 'Letra más grande'}">${UI.letra === 'grande' ? 'A−' : 'A+'}</button><a class="btn chico icono-solo" href="#/editor" aria-label="Editar programas">${ICON.lapiz}</a>`;
  return `<header class="top"><div class="marca"><b>${esc(a.congregacion)}</b><span>${r.editor ? 'Editor de programas' : esc(a.subtitulo)}</span></div><div class="top-acc">${der}</div></header>`;
}
function navegacion(r) {
  if (UI.cargando || (r.editor && Store.nube && !Store.editor)) return '';
  const items = r.editor
    ? [['programas', '#/editor', 'Programas', ICON.cal], ['personas', '#/editor/personas', 'Personas', ICON.gente], ['formatos', '#/editor/formatos', 'Formatos', ICON.molde], ['ajustes', '#/editor/ajustes', 'Ajustes', ICON.ajustes]]
    : [['reuniones', '#/', 'Reuniones', ICON.cal], ['programas', '#/programas', 'Programas', ICON.cuadros], ['personas', '#/personas', 'Personas', ICON.gente]];
  const act = r.editor ? ({ programa: 'programas', formato: 'formatos' }[r.vista] || r.vista) : r.vista;
  return `<nav class="nav" aria-label="Secciones">${items.map(([k, h, t, i]) => `<a href="${h}" class="${k === act ? 'on' : ''}" ${k === act ? 'aria-current="page"' : ''}>${i}<span>${t}</span></a>`).join('')}</nav>`;
}
function vistaEditor(r) {
  switch (r.vista) {
    case 'programa': return edPrograma(r.id);
    case 'personas': return edPersonas();
    case 'formatos': return edFormatos();
    case 'formato': return edFormato(r.id);
    case 'ajustes': return edAjustes();
    default: return edProgramas();
  }
}
function vistaLector(r) { if (r.vista === 'programas') return lectorProgramas(); if (r.vista === 'personas') return lectorPersonas(); return lectorReuniones(); }
function render() {
  const r = ruta();
  let cuerpo;
  if (UI.cargando) cuerpo = '<div class="cargando">Cargando programas…</div>';
  else if (UI.error) cuerpo = vacio(UI.error, '<button class="btn" data-act="reintentar">Intentar de nuevo</button>');
  else if (r.editor) cuerpo = (Store.nube && !Store.editor) ? vistaLogin() : vistaEditor(r);
  else cuerpo = vistaLector(r);
  $('#app').innerHTML = cabecera(r) + `<main class="main ${r.editor ? 'ed' : ''}">${cuerpo}</main>` + navegacion(r);
  const tira = $('#tira'); const on = tira && tira.querySelector('.on');
  if (tira && on) tira.scrollLeft = on.offsetLeft - tira.clientWidth / 2 + on.offsetWidth / 2;
}
function aplicarLetra() { document.documentElement.classList.toggle('letra-grande', UI.letra === 'grande'); }
function toast(msg) {
  let t = $('#toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg; t.classList.add('ver'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('ver'), 2800);
}
async function recargar() {
  UI.cargando = true; UI.error = ''; render();
  try { asignar(await Store.cargar()); }
  catch (e) { console.error(e); UI.error = 'No se pudieron cargar los programas. Revisa tu conexión e intenta de nuevo.'; }
  UI.cargando = false; render();
}

/* ===================== Eventos ===================== */
document.addEventListener('click', async ev => {
  const capa = $('#capa');
  if (capa && ev.target === capa) { cerrarSheet(); return; }
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const fn = A[el.dataset.act]; if (!fn) return;
  ev.preventDefault();
  try { await fn(el, ev); } catch (e) { console.error(e); toast('Algo falló: ' + (e.message || e)); }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && UI.sheet) { cerrarSheet(); return; }
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('figure[data-act]')) { ev.preventDefault(); ev.target.click(); }
});
document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.dataset.input) { const f = ENTRADAS[el.dataset.input]; if (f) f(el); return; }
  if (el.dataset.np) { UI.np[el.dataset.np] = el.value; return; }
  if (el.dataset.bind && el.type !== 'checkbox' && el.tagName !== 'SELECT' && el.type !== 'date') aplicarBind(el, false);
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.dataset.change) { const f = CAMBIOS[el.dataset.change]; if (f) f(el); return; }
  if (el.dataset.np) { UI.np[el.dataset.np] = el.value; if (el.tagName === 'SELECT') pintarSheet(); return; }
  if (el.dataset.bind) aplicarBind(el, el.hasAttribute('data-rerender'));
});
document.addEventListener('submit', async ev => {
  const fm = ev.target; if (fm.dataset.form !== 'login') return;
  ev.preventDefault();
  const btn = fm.querySelector('[type=submit]'); btn.disabled = true; btn.textContent = 'Entrando…';
  try { await Store.entrar(fm.email.value.trim(), fm.pass.value); await recargar(); if (!Store.editor) toast('Tu cuenta no tiene permiso de editor.'); }
  catch (e) { console.error(e); toast('Correo o contraseña incorrectos.'); btn.disabled = false; btn.textContent = 'Entrar'; }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') guardarYa(); });
window.addEventListener('hashchange', () => { if (UI.sheet) cerrarSheet(); render(); window.scrollTo(0, 0); });

(async function arrancar() {
  try { UI.letra = localStorage.getItem('agenda-letra') || 'normal'; } catch (e) { }
  aplicarLetra(); render();
  await Store.iniciar();
  await recargar();
})();
</script>
</body>
</html>
